AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Connect Real-time Transcript Viewer
  Self-contained solution: Kinesis ingestion, DynamoDB storage, API Gateway,
  CloudFront frontend, and automatic Contact Lens configuration.

Parameters:
  ConnectInstanceId:
    Type: String
    Description: Amazon Connect Instance ID (UUID format, e.g. a1b2c3d4-5678-90ab-cdef-123456789012)
    MinLength: 36
    MaxLength: 36

  SourceBucket:
    Type: String
    Description: S3 bucket containing frontend files

  SourcePrefix:
    Type: String
    Default: 'files/'
    Description: S3 prefix for frontend files

Resources:
  # ============================================================
  # DATA INGESTION PIPELINE
  # ============================================================

  # Kinesis Data Stream - receives Contact Lens real-time events
  TranscriptStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub '${AWS::StackName}-transcript-stream'
      StreamModeDetails:
        StreamMode: ON_DEMAND
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  # DynamoDB Table - stores transcript segments
  TranscriptTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-transcripts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contactId
          AttributeType: S
        - AttributeName: segmentId
          AttributeType: S
      KeySchema:
        - AttributeName: contactId
          KeyType: HASH
        - AttributeName: segmentId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # IAM Role for Kinesis Processor Lambda
  KinesisProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KinesisAndDynamoDB
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:DescribeStream
                  - kinesis:ListShards
                Resource: !GetAtt TranscriptStream.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt TranscriptTable.Arn

  # Kinesis Processor Lambda - processes Contact Lens events into DynamoDB
  KinesisProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-kinesis-processor'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt KinesisProcessorRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref TranscriptTable
          CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, PutCommand } = require('@aws-sdk/lib-dynamodb');
          const client = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(client);
          const TABLE_NAME = process.env.TABLE_NAME;
          
          exports.handler = async (event) => {
            console.log('Processing', event.Records?.length, 'records');
            const promises = [];
            let processedCount = 0;
            
            for (const record of event.Records) {
              try {
                const payload = JSON.parse(Buffer.from(record.kinesis.data, 'base64').toString('utf-8'));
                
                if (payload.EventType === 'STARTED') {
                  promises.push(docClient.send(new PutCommand({
                    TableName: TABLE_NAME,
                    Item: {
                      contactId: payload.ContactId,
                      segmentId: `${payload.ContactId}-CALL-START`,
                      eventType: 'CALL_START',
                      instanceId: payload.InstanceId,
                      timestamp: new Date().toISOString(),
                      ttl: Math.floor(Date.now() / 1000) + (24 * 60 * 60)
                    }
                  })));
                  processedCount++;
                  
                } else if (payload.EventType === 'SEGMENTS' && payload.Segments) {
                  for (const segment of payload.Segments) {
                    const t = segment.Transcript || segment.Utterance;
                    
                    if (t && t.Content) {
                      promises.push(docClient.send(new PutCommand({
                        TableName: TABLE_NAME,
                        Item: {
                          contactId: payload.ContactId,
                          segmentId: t.Id,
                          participantRole: t.ParticipantRole || 'UNKNOWN',
                          participantId: t.ParticipantId || t.ParticipantRole || 'UNKNOWN',
                          content: t.Content,
                          sentiment: t.Sentiment || 'NEUTRAL',
                          timestamp: new Date().toISOString(),
                          beginOffsetMillis: t.BeginOffsetMillis,
                          endOffsetMillis: t.EndOffsetMillis,
                          instanceId: payload.InstanceId,
                          languageCode: payload.LanguageCode,
                          issuesDetected: t.IssuesDetected || [],
                          ttl: Math.floor(Date.now() / 1000) + (24 * 60 * 60)
                        }
                      })));
                      processedCount++;
                    }
                  }
                }
              } catch (error) {
                console.error('Error processing record:', error);
              }
            }
            
            await Promise.all(promises);
            console.log(`Processed ${processedCount} records`);
            return { statusCode: 200 };
          };

  # Event Source Mapping - triggers Lambda from Kinesis
  KinesisEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TranscriptStream.Arn
      FunctionName: !GetAtt KinesisProcessorFunction.Arn
      StartingPosition: LATEST
      BatchSize: 100

  # ============================================================
  # API LAYER
  # ============================================================

  # IAM Role for API Lambda
  APILambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt TranscriptTable.Arn

  # API Lambda - serves transcript data
  APILambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api-handler'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt APILambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref TranscriptTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, QueryCommand } = require('@aws-sdk/lib-dynamodb');
          const client = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(client);
          const TABLE_NAME = process.env.TABLE_NAME;
          const headers = {
            'Content-Type': 'application/json',
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Methods': 'GET,OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type'
          };
          
          exports.handler = async (event) => {
            if (event.httpMethod === 'OPTIONS') {
              return { statusCode: 200, headers, body: '' };
            }
            try {
              const contactId = event.queryStringParameters?.contactId;
              if (!contactId) {
                return { statusCode: 400, headers, body: JSON.stringify({ success: false, error: 'contactId required' }) };
              }
              const result = await docClient.send(new QueryCommand({
                TableName: TABLE_NAME,
                KeyConditionExpression: 'contactId = :id',
                ExpressionAttributeValues: { ':id': contactId },
                ScanIndexForward: true
              }));
              const segments = (result.Items || [])
                .filter(item => item.participantRole && item.content)
                .map(item => ({
                id: item.segmentId,
                timestamp: item.timestamp,
                participantRole: item.participantRole,
                content: item.content,
                sentiment: item.sentiment || 'NEUTRAL'
              }));
              return {
                statusCode: 200,
                headers,
                body: JSON.stringify({ success: true, contactId, segments, callStatus: 'active', segmentCount: segments.length })
              };
            } catch (error) {
              console.error('Error:', error);
              return { statusCode: 500, headers, body: JSON.stringify({ success: false, error: error.message }) };
            }
          };

  # API Gateway
  TranscriptAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      EndpointConfiguration:
        Types:
          - REGIONAL

  TranscriptResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TranscriptAPI
      ParentId: !GetAtt TranscriptAPI.RootResourceId
      PathPart: transcript

  TranscriptMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TranscriptAPI
      ResourceId: !Ref TranscriptResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${APILambdaFunction.Arn}/invocations'

  TranscriptOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TranscriptAPI
      ResourceId: !Ref TranscriptResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - TranscriptMethod
      - TranscriptOptionsMethod
    Properties:
      RestApiId: !Ref TranscriptAPI
      StageName: prod

  LambdaAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref APILambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TranscriptAPI}/*/*/transcript'

  # ============================================================
  # FRONTEND LAYER
  # ============================================================

  # S3 Bucket - hosts frontend (AES256 encryption for OAI compatibility)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # CloudFront OAI
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${AWS::StackName}'

  # S3 Bucket Policy - CloudFront OAI access only
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
          MinTTL: 0
          DefaultTTL: 300
          MaxTTL: 86400
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ============================================================
  # FRONTEND DEPLOYMENT (Custom Resource)
  # ============================================================

  FrontendDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub '${FrontendBucket.Arn}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${SourceBucket}/${SourcePrefix}*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt FrontendBucket.Arn
                  - !Sub 'arn:${AWS::Partition}:s3:::${SourceBucket}'
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  FrontendDeploymentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-frontend-deploy'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FrontendDeploymentRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json, boto3, urllib3
          s3 = boto3.client('s3')
          cf = boto3.client('cloudfront')
          http = urllib3.PoolManager()
          
          def send(event, context, status, data):
              body = json.dumps({'Status': status, 'PhysicalResourceId': context.log_stream_name, 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data})
              http.request('PUT', event['ResponseURL'], body=body.encode(), headers={'content-type': '', 'content-length': str(len(body))})
          
          def handler(event, context):
              print(json.dumps(event))
              try:
                  if event['RequestType'] == 'Delete':
                      send(event, context, 'SUCCESS', {})
                      return
                  
                  bucket = event['ResourceProperties']['BucketName']
                  api = event['ResourceProperties']['ApiEndpoint']
                  dist = event['ResourceProperties']['DistributionId']
                  src_bucket = event['ResourceProperties']['SourceBucket']
                  src_prefix = event['ResourceProperties']['SourcePrefix']
                  region = event['ResourceProperties']['Region']
                  
                  content_types = {'.html': 'text/html', '.js': 'application/javascript', '.css': 'text/css', '.map': 'application/json', '.ts': 'text/plain', '.txt': 'text/plain', '.json': 'application/json'}
                  
                  response = s3.list_objects_v2(Bucket=src_bucket, Prefix=src_prefix)
                  files = [obj['Key'] for obj in response.get('Contents', []) if not obj['Key'].endswith('/')]
                  print(f"Copying {len(files)} files from {src_bucket}/{src_prefix}")
                  
                  for file_key in files:
                      file_name = file_key.replace(src_prefix, '')
                      ext = '.' + file_name.split('.')[-1] if '.' in file_name else ''
                      content_type = content_types.get(ext, 'application/octet-stream')
                      
                      obj = s3.get_object(Bucket=src_bucket, Key=file_key)
                      content = obj['Body'].read()
                      
                      if file_name == 'bundle.js':
                          try:
                              content_str = content.decode('utf-8')
                              content_str = content_str.replace('https://2k9xfh0m1h.execute-api.ap-southeast-2.amazonaws.com/prod/transcript', api)
                              content_str = f'window.API_ENDPOINT="{api}";window.AWS_REGION="{region}";' + content_str
                              content = content_str.encode('utf-8')
                          except:
                              pass
                      
                      if file_name == 'index.html':
                          try:
                              content_str = content.decode('utf-8')
                              # Inject refresh bar and auto-reload
                              refresh_bar = '<div id="refresh-bar" style="height:36px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:#232f3e;"><button id="refresh-btn" onclick="window.location.reload()" title="Refresh dashboard" style="background:#0972d3;color:#fff;border:none;border-radius:6px;padding:4px 14px;font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;"><svg viewBox=&quot;0 0 16 16&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; style=&quot;width:14px;height:14px&quot;><path d=&quot;M1 1v5h5&quot;/><path d=&quot;M2.5 10.5a6 6 0 1 0 1-5L1 6&quot;/></svg>Refresh</button></div>'
                              # Add refresh bar before root div and adjust root height
                              content_str = content_str.replace('height: 100vh', 'height: calc(100vh - 36px)')
                              content_str = content_str.replace('<div id="root">', refresh_bar + '<div id="root">')
                              auto_reload = '''<script>
          (function(){
            var INITIAL_GRACE=15000,CHECK_INTERVAL=10000,STALE_THRESHOLD=30000,MAX_RELOADS=3;
            var RK='_transcript_auto_reloads',CK='_transcript_last_seen';
            function has(){var r=document.getElementById('root');if(!r)return false;var t=r.innerText||'';if(t.indexOf('AGENT')!==-1||t.indexOf('CUSTOMER')!==-1)return true;if(r.querySelectorAll('[class*="segment"],[class*="message"],[class*="chat"]').length>3)return true;return false;}
            function grc(){try{var d=JSON.parse(sessionStorage.getItem(RK)||'{}');if(d.ts&&(Date.now()-d.ts>120000))return 0;return d.count||0;}catch(e){return 0;}}
            function src(n){try{sessionStorage.setItem(RK,JSON.stringify({count:n,ts:Date.now()}));}catch(e){}}
            var es=null;
            setTimeout(function(){setInterval(function(){if(has()){es=null;src(0);try{sessionStorage.setItem(CK,String(Date.now()));}catch(e){}return;}if(!es){es=Date.now();return;}var el=Date.now()-es;if(el>=STALE_THRESHOLD){var rc=grc();if(rc<MAX_RELOADS){console.log('[auto-reload] No transcript for '+(el/1000|0)+'s, reloading ('+(rc+1)+'/'+MAX_RELOADS+')');src(rc+1);window.location.reload();}}},CHECK_INTERVAL);},INITIAL_GRACE);
          })();
          </script>'''
                              if '</body>' in content_str:
                                  content_str = content_str.replace('</body>', auto_reload + '</body>')
                              else:
                                  content_str += auto_reload
                              content = content_str.encode('utf-8')
                              print("Injected refresh bar and auto-reload script into index.html")
                          except Exception as e:
                              print(f"Warning: Could not inject into index.html: {e}")
                      
                      s3.put_object(Bucket=bucket, Key=file_name, Body=content, ContentType=content_type, CacheControl='max-age=300')
                      print(f"Copied {file_name}")
                  
                  cf.create_invalidation(DistributionId=dist, InvalidationBatch={'Paths': {'Quantity': 1, 'Items': ['/*']}, 'CallerReference': str(context.aws_request_id)})
                  send(event, context, 'SUCCESS', {'Message': f'Deployed {len(files)} files'})
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  send(event, context, 'FAILED', {'Message': str(e)})

  FrontendDeployment:
    Type: Custom::FrontendDeployment
    Properties:
      ServiceToken: !GetAtt FrontendDeploymentFunction.Arn
      BucketName: !Ref FrontendBucket
      ApiEndpoint: !Sub 'https://${TranscriptAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/transcript'
      DistributionId: !Ref CloudFrontDistribution
      SourceBucket: !Ref SourceBucket
      SourcePrefix: !Ref SourcePrefix
      Region: !Ref 'AWS::Region'
      Version: '2.0'

  # ============================================================
  # CONTACT LENS AUTO-CONFIGURATION (Custom Resource)
  # Runs last - associates Kinesis stream with Contact Lens
  # ============================================================

  ContactLensConfigRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConnectAndKinesis
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - connect:AssociateInstanceStorageConfig
                  - connect:DisassociateInstanceStorageConfig
                  - connect:ListInstanceStorageConfigs
                Resource: !Sub 'arn:${AWS::Partition}:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}'
              - Effect: Allow
                Action:
                  - kinesis:DescribeStream
                Resource: !GetAtt TranscriptStream.Arn
              - Effect: Allow
                Action:
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/connect.amazonaws.com/*'

  ContactLensConfigFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-contactlens-config'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ContactLensConfigRole.Arn
      Timeout: 120
      Code:
        ZipFile: |
          import json, boto3, urllib3, time
          connect = boto3.client('connect')
          kinesis = boto3.client('kinesis')
          http = urllib3.PoolManager()
          
          def send(event, context, status, data, physical_id=None):
              body = json.dumps({
                  'Status': status,
                  'PhysicalResourceId': physical_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data
              })
              http.request('PUT', event['ResponseURL'], body=body.encode(),
                          headers={'content-type': '', 'content-length': str(len(body))})
          
          def handler(event, context):
              print(json.dumps(event))
              physical_id = event.get('PhysicalResourceId')
              try:
                  instance_id = event['ResourceProperties']['InstanceId']
                  stream_arn = event['ResourceProperties']['StreamArn']
                  
                  if event['RequestType'] == 'Delete':
                      # Find and remove our association
                      try:
                          configs = connect.list_instance_storage_configs(
                              InstanceId=instance_id,
                              ResourceType='REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS'
                          )
                          for cfg in configs.get('StorageConfigs', []):
                              if cfg.get('KinesisStreamConfig', {}).get('StreamArn') == stream_arn:
                                  connect.disassociate_instance_storage_config(
                                      InstanceId=instance_id,
                                      AssociationId=cfg['AssociationId'],
                                      ResourceType='REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS'
                                  )
                                  print(f"Removed association {cfg['AssociationId']}")
                                  break
                      except Exception as e:
                          print(f"Delete cleanup: {e}")
                      send(event, context, 'SUCCESS', {}, physical_id)
                      return
                  
                  # Check if already configured with our stream
                  existing = connect.list_instance_storage_configs(
                      InstanceId=instance_id,
                      ResourceType='REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS'
                  )
                  for cfg in existing.get('StorageConfigs', []):
                      if cfg.get('KinesisStreamConfig', {}).get('StreamArn') == stream_arn:
                          print("Already configured with our stream")
                          send(event, context, 'SUCCESS', {'AssociationId': cfg['AssociationId']},
                              f"assoc-{cfg['AssociationId']}")
                          return
                  
                  # Remove any existing association first
                  for cfg in existing.get('StorageConfigs', []):
                      try:
                          connect.disassociate_instance_storage_config(
                              InstanceId=instance_id,
                              AssociationId=cfg['AssociationId'],
                              ResourceType='REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS'
                          )
                          print(f"Removed old association {cfg['AssociationId']}")
                          time.sleep(5)
                      except Exception as e:
                          print(f"Could not remove old association: {e}")
                  
                  # Wait for Kinesis stream to be active
                  stream_name = stream_arn.split('/')[-1]
                  for i in range(12):
                      resp = kinesis.describe_stream(StreamName=stream_name)
                      if resp['StreamDescription']['StreamStatus'] == 'ACTIVE':
                          break
                      time.sleep(5)
                  
                  # Associate our stream
                  time.sleep(10)  # Extra propagation wait
                  response = connect.associate_instance_storage_config(
                      InstanceId=instance_id,
                      ResourceType='REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS',
                      StorageConfig={
                          'StorageType': 'KINESIS_STREAM',
                          'KinesisStreamConfig': {'StreamArn': stream_arn}
                      }
                  )
                  aid = response.get('AssociationId', 'unknown')
                  print(f"Associated: {aid}")
                  send(event, context, 'SUCCESS', {'AssociationId': aid}, f"assoc-{aid}")
                  
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  send(event, context, 'FAILED', {'Message': str(e)}, physical_id or context.log_stream_name)

  ContactLensConfiguration:
    Type: Custom::ContactLensConfig
    DependsOn:
      - TranscriptStream
      - KinesisProcessorFunction
      - FrontendDeployment
    Properties:
      ServiceToken: !GetAtt ContactLensConfigFunction.Arn
      InstanceId: !Ref ConnectInstanceId
      StreamArn: !GetAtt TranscriptStream.Arn
      Version: '1.0'

# ============================================================
# OUTPUTS
# ============================================================
Outputs:
  CloudFrontURL:
    Description: Transcript viewer URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  AgentWorkspaceURL:
    Description: URL for Agent Workspace integration (add as third-party app)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}?embedded=true'

  APIEndpoint:
    Description: API Gateway endpoint
    Value: !Sub 'https://${TranscriptAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/transcript'

  KinesisStreamARN:
    Description: Kinesis Stream ARN
    Value: !GetAtt TranscriptStream.Arn

  KinesisStreamName:
    Description: Kinesis Stream Name
    Value: !Ref TranscriptStream

  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref TranscriptTable

  FrontendBucketName:
    Description: S3 bucket for frontend files
    Value: !Ref FrontendBucket

