AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Connect Real-time Transcript Viewer - Fully Automated
  Complete solution with Kinesis ingestion, DynamoDB storage, API Gateway,
  and CloudFront-hosted frontend with Agent Workspace SDK integration.
  Contact Lens data streaming configured automatically via CloudFormation.

Parameters:
  ConnectInstanceId:
    Type: String
    Description: Amazon Connect Instance ID (UUID format)
    AllowedPattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
    MinLength: 36
    MaxLength: 36

  SourceBucket:
    Type: String
    Default: 'bucketname'
    Description: S3 bucket containing frontend files

  SourcePrefix:
    Type: String
    Default: 'files/'
    Description: S3 prefix for frontend files

Resources:
  # KMS Key for DynamoDB encryption
  DynamoDBKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for DynamoDB table encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow DynamoDB to use the key
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
              - 'kms:CreateGrant'
            Resource: '*'

  DynamoDBKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-dynamodb'
      TargetKeyId: !Ref DynamoDBKMSKey

  # KMS Key for Lambda environment variables
  LambdaKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Lambda environment variable encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Lambda to use the key
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'

  LambdaKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-lambda'
      TargetKeyId: !Ref LambdaKMSKey

  # KMS Key for S3 encryption
  S3KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for S3 bucket encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow S3 to use the key
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'

  S3KMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-s3'
      TargetKeyId: !Ref S3KMSKey

  # S3 Bucket for Logging
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90

  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Statement:
          - Sid: AWSCloudFrontLogging
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LoggingBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LoggingBucket.Arn
              - !Sub '${LoggingBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # DynamoDB Table
  TranscriptTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contactId
          AttributeType: S
        - AttributeName: segmentId
          AttributeType: S
      KeySchema:
        - AttributeName: contactId
          KeyType: HASH
        - AttributeName: segmentId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDBKMSKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Kinesis Data Stream
  TranscriptStream:
    Type: AWS::Kinesis::Stream
    Properties:
      ShardCount: 1
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  # Dead Letter Queues for Lambda error handling
  KinesisProcessorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: alias/aws/sqs

  APIHandlerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  FrontendDeploymentDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  # IAM Policies (Managed instead of inline)
  KinesisProcessorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kinesis:GetRecords
              - kinesis:GetShardIterator
              - kinesis:DescribeStream
              - kinesis:ListShards
            Resource: !GetAtt TranscriptStream.Arn
          - Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt TranscriptTable.Arn
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt KinesisProcessorDLQ.Arn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource:
              - !GetAtt DynamoDBKMSKey.Arn
              - !GetAtt LambdaKMSKey.Arn

  # IAM Role for Kinesis Processor Lambda
  KinesisProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref KinesisProcessorPolicy

  # Kinesis Processor Lambda
  KinesisProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-kinesis-processor'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt KinesisProcessorRole.Arn
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 10
      DeadLetterConfig:
        TargetArn: !GetAtt KinesisProcessorDLQ.Arn
      KmsKeyArn: !GetAtt LambdaKMSKey.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TranscriptTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, PutCommand } = require('@aws-sdk/lib-dynamodb');
          const dynamoClient = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(dynamoClient);
          const TABLE_NAME = process.env.TABLE_NAME;
          
          exports.handler = async (event) => {
            console.log('Processing', event.Records?.length, 'records');
            for (const record of event.Records || []) {
              try {
                const payload = JSON.parse(Buffer.from(record.kinesis.data, 'base64').toString());
                if (payload.EventType === 'SEGMENTS' && payload.Segments) {
                  for (const segment of payload.Segments) {
                    if (segment.Transcript) {
                      const t = segment.Transcript;
                      await docClient.send(new PutCommand({
                        TableName: TABLE_NAME,
                        Item: {
                          contactId: payload.ContactId,
                          segmentId: `${t.BeginOffsetMillis || 0}`,
                          timestamp: new Date().toISOString(),
                          participantRole: t.ParticipantRole || 'UNKNOWN',
                          content: t.Content || '',
                          sentiment: t.Sentiment || 'NEUTRAL'
                        }
                      }));
                    }
                  }
                }
              } catch (error) {
                console.error('Error:', error);
              }
            }
            return { statusCode: 200 };
          };

  # Event Source Mapping
  KinesisEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TranscriptStream.Arn
      FunctionName: !GetAtt KinesisProcessorFunction.Arn
      StartingPosition: LATEST
      BatchSize: 100

  # IAM Policy for API Lambda
  APILambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !GetAtt TranscriptTable.Arn
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt APIHandlerDLQ.Arn
          - Effect: Allow
            Action:
              - kms:Decrypt
            Resource:
              - !GetAtt DynamoDBKMSKey.Arn
              - !GetAtt LambdaKMSKey.Arn

  # IAM Role for API Lambda
  APILambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref APILambdaPolicy

  # API Lambda
  APILambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api-handler'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt APILambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt APIHandlerDLQ.Arn
      KmsKeyArn: !GetAtt LambdaKMSKey.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TranscriptTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, QueryCommand } = require('@aws-sdk/lib-dynamodb');
          const dynamoClient = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(dynamoClient);
          const TABLE_NAME = process.env.TABLE_NAME;
          const headers = {
            'Content-Type': 'application/json',
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Methods': 'GET,OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type'
          };
          
          exports.handler = async (event) => {
            if (event.httpMethod === 'OPTIONS') {
              return { statusCode: 200, headers, body: '{}' };
            }
            try {
              const contactId = event.queryStringParameters?.contactId;
              if (!contactId) {
                return { statusCode: 400, headers, body: JSON.stringify({ success: false, error: 'contactId required' }) };
              }
              const result = await docClient.send(new QueryCommand({
                TableName: TABLE_NAME,
                KeyConditionExpression: 'contactId = :id',
                ExpressionAttributeValues: { ':id': contactId },
                ScanIndexForward: true
              }));
              const segments = (result.Items || []).map(item => ({
                id: item.segmentId,
                timestamp: item.timestamp,
                participantRole: item.participantRole,
                content: item.content,
                sentiment: item.sentiment || 'NEUTRAL'
              }));
              segments.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
              const latestTime = segments.length ? new Date(segments[segments.length - 1].timestamp) : new Date();
              const callStatus = (new Date() - latestTime) < 300000 ? 'active' : 'ended';
              return {
                statusCode: 200,
                headers,
                body: JSON.stringify({ success: true, contactId, segments, callStatus, segmentCount: segments.length })
              };
            } catch (error) {
              console.error('Error:', error);
              return { statusCode: 500, headers, body: JSON.stringify({ success: false, error: error.message }) };
            }
          };

  # API Gateway
  TranscriptAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      EndpointConfiguration:
        Types:
          - REGIONAL

  TranscriptResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TranscriptAPI
      ParentId: !GetAtt TranscriptAPI.RootResourceId
      PathPart: transcript

  TranscriptMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TranscriptAPI
      ResourceId: !Ref TranscriptResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${APILambdaFunction.Arn}/invocations'

  TranscriptOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TranscriptAPI
      ResourceId: !Ref TranscriptResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - TranscriptMethod
      - TranscriptOptionsMethod
    Properties:
      RestApiId: !Ref TranscriptAPI
      StageName: prod

  LambdaAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref APILambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TranscriptAPI}/*/*/transcript'

  # S3 Bucket
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref S3KMSKey
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: s3-access-logs/
      ObjectLockEnabled: false

  # CloudFront OAI
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${FrontendBucket}'

  # S3 Bucket Policy
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
        Enabled: true
        DefaultRootObject: index.html
        Logging:
          Bucket: !GetAtt LoggingBucket.DomainName
          Prefix: cloudfront-logs/
          IncludeCookies: false
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
          MinTTL: 0
          DefaultTTL: 300
          MaxTTL: 86400
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_All
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  # IAM Policy for Frontend Deployment
  FrontendDeploymentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource:
              - !Sub '${FrontendBucket.Arn}/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${SourceBucket}/${SourcePrefix}*'
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub 'arn:${AWS::Partition}:s3:::${SourceBucket}'
          - Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt FrontendDeploymentDLQ.Arn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource:
              - !GetAtt S3KMSKey.Arn
              - !GetAtt LambdaKMSKey.Arn

  # IAM Role for Frontend Deployment
  FrontendDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref FrontendDeploymentPolicy

  # Frontend Deployment Lambda
  FrontendDeploymentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-frontend-deployment'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FrontendDeploymentRole.Arn
      Timeout: 300
      ReservedConcurrentExecutions: 1
      DeadLetterConfig:
        TargetArn: !GetAtt FrontendDeploymentDLQ.Arn
      KmsKeyArn: !GetAtt LambdaKMSKey.Arn
      Code:
        ZipFile: |
          import json, boto3, urllib3
          s3 = boto3.client('s3')
          cf = boto3.client('cloudfront')
          http = urllib3.PoolManager()
          
          def send(event, context, status, data):
              body = json.dumps({'Status': status, 'PhysicalResourceId': context.log_stream_name, 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data})
              http.request('PUT', event['ResponseURL'], body=body.encode(), headers={'content-type': '', 'content-length': str(len(body))})
          
          def handler(event, context):
              print(json.dumps(event))
              try:
                  if event['RequestType'] == 'Delete':
                      send(event, context, 'SUCCESS', {})
                      return
                  
                  bucket = event['ResourceProperties']['BucketName']
                  api = event['ResourceProperties']['ApiEndpoint']
                  dist = event['ResourceProperties']['DistributionId']
                  src_bucket = event['ResourceProperties']['SourceBucket']
                  src_prefix = event['ResourceProperties']['SourcePrefix']
                  region = event['ResourceProperties']['Region']
                  
                  # Content type mapping for all Sydney files
                  content_types = {
                      '.html': 'text/html',
                      '.js': 'application/javascript',
                      '.css': 'text/css',
                      '.map': 'application/json',
                      '.ts': 'text/plain',
                      '.txt': 'text/plain'
                  }
                  
                  # List all files in source prefix
                  response = s3.list_objects_v2(Bucket=src_bucket, Prefix=src_prefix)
                  files = [obj['Key'] for obj in response.get('Contents', []) if not obj['Key'].endswith('/')]
                  
                  print(f"Copying {len(files)} files from {src_bucket}/{src_prefix}")
                  
                  for file_key in files:
                      file_name = file_key.replace(src_prefix, '')
                      ext = '.' + file_name.split('.')[-1] if '.' in file_name else ''
                      content_type = content_types.get(ext, 'application/octet-stream')
                      
                      # Copy file
                      obj = s3.get_object(Bucket=src_bucket, Key=file_key)
                      content = obj['Body'].read()
                      
                      # For index.html, inject auto-reload script
                      if file_name == 'index.html':
                          try:
                              content_str = content.decode('utf-8')
                              # Inject auto-reload script before closing body tag
                              auto_reload_script = '<script>(function(){let currentContactId=null;let reloadTimer=null;function scheduleReload(){if(reloadTimer)clearTimeout(reloadTimer);console.log("[AutoReload] Scheduling reload in 5 seconds...");reloadTimer=setTimeout(()=>{console.log("[AutoReload] Reloading page...");window.location.reload();},5000);}if(window.connect&&window.connect.agent){window.connect.agent(function(agent){agent.onRefresh(function(){const contacts=agent.getContacts();if(contacts&&contacts.length>0){const contact=contacts[0];const contactId=contact.getContactId();if(contactId&&contactId!==currentContactId){console.log("[AutoReload] New contact detected:",contactId);currentContactId=contactId;scheduleReload();}}});});}})();</script>'
                              # Insert before closing body tag
                              if '</body>' in content_str:
                                  content_str = content_str.replace('</body>', auto_reload_script + '</body>')
                              else:
                                  content_str += auto_reload_script
                              content = content_str.encode('utf-8')
                              print("Injected auto-reload script into index.html")
                          except Exception as e:
                              print(f"Warning: Could not inject auto-reload script: {e}")
                      
                      # For bundle.js, inject API endpoint and replace hardcoded Sydney endpoint
                      elif file_name == 'bundle.js':
                          try:
                              content_str = content.decode('utf-8')
                              # Replace hardcoded Sydney API endpoint with new endpoint
                              content_str = content_str.replace(
                                  'https://2k9xfh0m1h.execute-api.ap-southeast-2.amazonaws.com/prod/transcript',
                                  api
                              )
                              # Also add API endpoint as global variable at start of bundle
                              content_str = f'window.API_ENDPOINT="{api}";window.AWS_REGION="{region}";' + content_str
                              content = content_str.encode('utf-8')
                          except:
                              pass  # If decode fails, copy as-is
                      
                      s3.put_object(
                          Bucket=bucket,
                          Key=file_name,
                          Body=content,
                          ContentType=content_type,
                          CacheControl='max-age=300'
                      )
                      print(f"Copied {file_name} with Content-Type: {content_type}")
                  
                  cf.create_invalidation(DistributionId=dist, InvalidationBatch={'Paths': {'Quantity': 1, 'Items': ['/*']}, 'CallerReference': str(context.aws_request_id)})
                  
                  send(event, context, 'SUCCESS', {'Message': f'Deployed {len(files)} files'})
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  send(event, context, 'FAILED', {'Message': str(e)})

  # Custom Resource
  FrontendDeployment:
    Type: Custom::FrontendDeployment
    DependsOn:
      - FrontendBucket
      - CloudFrontDistribution
      - APIDeployment
    Properties:
      ServiceToken: !GetAtt FrontendDeploymentFunction.Arn
      BucketName: !Ref FrontendBucket
      ApiEndpoint: !Sub 'https://${TranscriptAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/transcript'
      DistributionId: !Ref CloudFrontDistribution
      SourceBucket: !Ref SourceBucket
      SourcePrefix: !Ref SourcePrefix
      Region: !Ref 'AWS::Region'
      Version: '2.0'

  # IAM Role for Contact Lens Configuration
  ContactLensConfigRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref ContactLensConfigPolicy

  ContactLensConfigPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - connect:AssociateInstanceStorageConfig
              - connect:DisassociateInstanceStorageConfig
              - connect:ListInstanceStorageConfigs
            Resource: !Sub 'arn:${AWS::Partition}:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}'
          - Effect: Allow
            Action:
              - kinesis:DescribeStream
            Resource: !GetAtt TranscriptStream.Arn
          - Effect: Allow
            Action:
              - iam:PutRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/connect.amazonaws.com/*'

  # Contact Lens Auto-Configuration Lambda
  ContactLensConfigFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-contactlens-config'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ContactLensConfigRole.Arn
      Timeout: 300
      ReservedConcurrentExecutions: 1
      KmsKeyArn: !GetAtt LambdaKMSKey.Arn
      Code:
        ZipFile: |
          import json, boto3, urllib3, time
          connect = boto3.client('connect')
          kinesis = boto3.client('kinesis')
          http = urllib3.PoolManager()
          
          def send(event, context, status, data, physical_id=None):
              if not physical_id:
                  physical_id = context.log_stream_name
              body = json.dumps({
                  'Status': status,
                  'PhysicalResourceId': physical_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data
              })
              http.request('PUT', event['ResponseURL'], body=body.encode(), 
                          headers={'content-type': '', 'content-length': str(len(body))})
          
          def wait_for_kinesis_stream(stream_arn, max_attempts=30):
              """Wait for Kinesis stream to be fully available"""
              stream_name = stream_arn.split('/')[-1]
              for attempt in range(max_attempts):
                  try:
                      response = kinesis.describe_stream(StreamName=stream_name)
                      status = response['StreamDescription']['StreamStatus']
                      if status == 'ACTIVE':
                          print(f"Kinesis stream is ACTIVE after {attempt + 1} attempts")
                          return True
                      print(f"Attempt {attempt + 1}: Stream status is {status}, waiting...")
                      time.sleep(10)
                  except Exception as e:
                      print(f"Attempt {attempt + 1}: Error checking stream: {e}")
                      time.sleep(10)
              return False
          
          def handler(event, context):
              print(json.dumps(event))
              physical_id = event.get('PhysicalResourceId')
              
              try:
                  instance_id = event['ResourceProperties']['InstanceId']
                  kinesis_arn = event['ResourceProperties']['KinesisStreamArn']
                  
                  if event['RequestType'] == 'Delete':
                      if physical_id and physical_id.startswith('storage-'):
                          association_id = physical_id.replace('storage-', '')
                          try:
                              connect.disassociate_instance_storage_config(
                                  InstanceId=instance_id,
                                  AssociationId=association_id,
                                  ResourceType='REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS'
                              )
                              print(f"Disassociated storage config: {association_id}")
                          except Exception as e:
                              print(f"Could not disassociate (may not exist): {e}")
                      send(event, context, 'SUCCESS', {}, physical_id)
                      return
                  
                  # Wait for Kinesis stream to be fully available
                  print("Waiting for Kinesis stream to be ACTIVE...")
                  if not wait_for_kinesis_stream(kinesis_arn):
                      send(event, context, 'FAILED', {
                          'Message': 'Kinesis stream did not become ACTIVE in time'
                      }, physical_id or context.log_stream_name)
                      return
                  
                  # Additional wait for AWS propagation
                  print("Waiting 30 seconds for AWS propagation...")
                  time.sleep(30)
                  
                  # Create or update - Associate Kinesis stream for Contact Lens
                  max_retries = 5
                  for retry in range(max_retries):
                      try:
                          response = connect.associate_instance_storage_config(
                              InstanceId=instance_id,
                              ResourceType='REAL_TIME_CONTACT_ANALYSIS_VOICE_SEGMENTS',
                              StorageConfig={
                                  'StorageType': 'KINESIS_STREAM',
                                  'KinesisStreamConfig': {
                                      'StreamArn': kinesis_arn
                                  }
                              }
                          )
                          association_id = response.get('AssociationId', 'unknown')
                          physical_id = f"storage-{association_id}"
                          print(f"Successfully associated Contact Lens with Kinesis: {association_id}")
                          send(event, context, 'SUCCESS', {
                              'Message': 'Contact Lens configured successfully',
                              'AssociationId': association_id
                          }, physical_id)
                          return
                          
                      except connect.exceptions.ResourceNotFoundException as e:
                          if retry < max_retries - 1:
                              wait_time = 30 * (retry + 1)
                              print(f"Retry {retry + 1}/{max_retries}: Stream not found, waiting {wait_time}s...")
                              time.sleep(wait_time)
                          else:
                              raise
                              
                      except connect.exceptions.ResourceConflictException as e:
                          print(f"Already configured: {e}")
                          send(event, context, 'SUCCESS', {
                              'Message': 'Already configured'
                          }, physical_id or context.log_stream_name)
                          return
                  
                  # If we get here, all retries failed
                  send(event, context, 'FAILED', {
                      'Message': 'Failed to associate after multiple retries'
                  }, physical_id or context.log_stream_name)
                      
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  send(event, context, 'FAILED', {'Message': str(e)}, 
                      physical_id or context.log_stream_name)

  # Custom Resource for Contact Lens Configuration
  ContactLensConfiguration:
    Type: Custom::ContactLensConfig
    DependsOn:
      - TranscriptStream
      - KinesisProcessorFunction
    Properties:
      ServiceToken: !GetAtt ContactLensConfigFunction.Arn
      InstanceId: !Ref ConnectInstanceId
      KinesisStreamArn: !GetAtt TranscriptStream.Arn
      Version: '2.0'

Outputs:
  CloudFrontURL:
    Description: Transcript viewer URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  AgentWorkspaceURL:
    Description: URL for Agent Workspace integration (embed this in Connect)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}?embedded=true'

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName

  APIEndpoint:
    Description: API Gateway endpoint
    Value: !Sub 'https://${TranscriptAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/transcript'

  KinesisStreamARN:
    Description: Kinesis Stream ARN - Configure this in Contact Lens Data Streaming
    Value: !GetAtt TranscriptStream.Arn

  KinesisStreamName:
    Description: Kinesis Stream Name
    Value: !Ref TranscriptStream

  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref TranscriptTable

  DynamoDBKMSKeyId:
    Description: KMS Key ID for DynamoDB encryption
    Value: !Ref DynamoDBKMSKey

  LambdaKMSKeyId:
    Description: KMS Key ID for Lambda environment variable encryption
    Value: !Ref LambdaKMSKey

  S3KMSKeyId:
    Description: KMS Key ID for S3 bucket encryption
    Value: !Ref S3KMSKey

  LoggingBucketName:
    Description: S3 bucket for CloudFront and S3 access logs
    Value: !Ref LoggingBucket

  SecurityFeatures:
    Description: Security features enabled in this deployment
    Value: DynamoDB encrypted with Customer Managed KMS, Lambda env vars encrypted, S3 encrypted with KMS, CloudFront TLS 1.2, Access logging enabled, API Gateway IAM auth, SSL-only S3 access, DLQ configured, Managed IAM policies

  ContactLensStatus:
    Description: Contact Lens configuration status
    Value: Automatically configured for real-time voice analysis

  DeploymentComplete:
    Description: Next steps
    Value: !Sub |
      ✅ Stack deployed successfully!
      ✅ Contact Lens automatically configured
      
      To test:
      1. Make a test call through Amazon Connect
      2. Open the viewer: https://${CloudFrontDistribution.DomainName}
      3. Real-time transcripts should appear during the call
      
      For Agent Workspace integration, use: https://${CloudFrontDistribution.DomainName}?embedded=true

